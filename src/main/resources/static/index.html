<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Agent ✈️</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f0f4f8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .chat-container {
    width: 700px;
    height: 90vh;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header-sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }
  .new-chat-btn {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.2s;
  }
  .new-chat-btn:hover { background: rgba(255,255,255,0.3); }

  /* ── Messages ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

  /* 欢迎消息 */
  .welcome {
    text-align: center;
    color: #888;
    font-size: 14px;
    padding: 40px 20px;
  }
  .welcome .icon { font-size: 48px; margin-bottom: 12px; }
  .welcome h2 { font-size: 20px; color: #333; margin-bottom: 8px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .suggestion-btn {
    background: #f0f4ff;
    border: 1px solid #c5d5ff;
    color: #1a73e8;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .suggestion-btn:hover { background: #e0eaff; }

  /* 消息气泡 */
  .message { display: flex; align-items: flex-start; gap: 10px; max-width: 90%; }
  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .message.assistant { align-self: flex-start; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .user .avatar { background: #1a73e8; color: white; font-size: 14px; font-weight: 600; }
  .assistant .avatar { background: #e8f0fe; }

  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    max-width: 100%;
    word-break: break-word;
  }
  .user .bubble {
    background: #1a73e8;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .assistant .bubble {
    background: #f8f9fa;
    color: #333;
    border-bottom-left-radius: 4px;
    border: 1px solid #e8eaed;
  }
  .assistant .bubble pre {
    background: #f1f3f4;
    padding: 8px 10px;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 13px;
    margin: 6px 0;
  }

  /* 工具调用 + 评分徽章 */
  .tool-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #e8f5e9;
    color: #2e7d32;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    margin-bottom: 8px;
    border: 1px solid #c8e6c9;
  }
  .eval-score { color: #f57c00; font-weight: 600; }

  /* 记忆提示条 */
  .memory-bar {
    background: #fff8e1;
    border-bottom: 1px solid #ffe082;
    padding: 6px 20px;
    font-size: 12px;
    color: #795548;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .memory-bar.hidden { display: none; }

  /* 加载动画 */
  .loading-bubble {
    background: #f8f9fa;
    border: 1px solid #e8eaed;
    padding: 14px 18px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    display: flex; gap: 5px; align-items: center;
  }
  .dot {
    width: 8px; height: 8px;
    background: #aaa; border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); }
    40% { transform: translateY(-8px); }
  }

  /* ── Input area ── */
  .input-area {
    padding: 16px 20px;
    border-top: 1px solid #e8eaed;
    background: white;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .input-box {
    flex: 1;
    border: 1.5px solid #e8eaed;
    border-radius: 24px;
    padding: 10px 16px;
    font-size: 14px;
    outline: none;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  .input-box:focus { border-color: #1a73e8; }
  .send-btn {
    width: 40px; height: 40px;
    background: #1a73e8;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #1558b0; }
  .send-btn:disabled { background: #ccc; cursor: not-allowed; }
  .send-btn svg { fill: white; }
</style>
</head>
<body>
<div class="chat-container">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <span style="font-size:24px">✈️</span>
      <div>
        <div class="header h1">Travel Agent</div>
        <div class="header-sub">AI 旅行价格助手 · DeepSeek + Function Calling</div>
      </div>
    </div>
    <button class="new-chat-btn" onclick="newChat()">+ 新对话</button>
  </div>

  <!-- Memory hint bar -->
  <div class="memory-bar hidden" id="memory-bar">
    <span>🧠</span><span id="memory-text"></span>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="icon">🌏</div>
      <h2>你好，我是旅行助手</h2>
      <p>我能查汇率、天气、航班，帮你规划旅行预算</p>
      <div class="suggestions">
        <button class="suggestion-btn" onclick="sendSuggestion(this)">新加坡飞东京，帮我查汇率和航班</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">曼谷最近天气怎么样</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">SGD换JPY汇率多少</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">新加坡飞首尔，7晚旅行大概多少钱</button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <textarea
      id="input"
      class="input-box"
      placeholder="问我任何旅行问题..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<script>
  // ── Session 管理 ─────────────────────────────────────────────
  // sessionId：短期会话 ID，new-chat 时会重置
  // userId：长期用户 ID，跨 session 不变，用于长期记忆
  function getSessionId() {
    let id = localStorage.getItem('travel_session_id');
    if (!id) {
      id = 'session_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('travel_session_id', id);
    }
    return id;
  }

  function getUserId() {
    let id = localStorage.getItem('travel_user_id');
    if (!id) {
      id = 'user_' + Math.random().toString(36).substr(2, 12);
      localStorage.setItem('travel_user_id', id);
    }
    return id;
  }

  function showMemoryBar(text) {
    const bar = document.getElementById('memory-bar');
    document.getElementById('memory-text').textContent = text;
    bar.classList.remove('hidden');
    // 3 秒后自动隐藏
    setTimeout(() => bar.classList.add('hidden'), 3000);
  }

  function newChat() {
    const sessionId = getSessionId();
    fetch(`/api/agent/session/${sessionId}`, { method: 'DELETE' })
      .finally(() => {
        // 仅清除 sessionId，保留 userId（长期记忆不重置）
        localStorage.removeItem('travel_session_id');
        document.getElementById('memory-bar').classList.add('hidden');
        document.getElementById('messages').innerHTML = `
          <div class="welcome" id="welcome">
            <div class="icon">🌏</div>
            <h2>你好，我是旅行助手</h2>
            <p>我能查汇率、天气、航班，帮你规划旅行预算</p>
            <div class="suggestions">
              <button class="suggestion-btn" onclick="sendSuggestion(this)">新加坡飞东京，帮我查汇率和航班</button>
              <button class="suggestion-btn" onclick="sendSuggestion(this)">曼谷最近天气怎么样</button>
              <button class="suggestion-btn" onclick="sendSuggestion(this)">SGD换JPY汇率多少</button>
              <button class="suggestion-btn" onclick="sendSuggestion(this)">新加坡飞首尔，7晚旅行大概多少钱</button>
            </div>
          </div>`;
      });
  }

  // ── 发送消息 ─────────────────────────────────────────────────
  let isLoading = false;

  function sendSuggestion(btn) {
    document.getElementById('input').value = btn.textContent;
    sendMessage();
  }

  function sendMessage() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text || isLoading) return;

    // 隐藏欢迎界面
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    // 显示用户消息
    appendMessage('user', text);
    input.value = '';
    input.style.height = 'auto';

    // 显示加载动画
    const loadingId = showLoading();
    isLoading = true;
    document.getElementById('send-btn').disabled = true;

    // 调用后端
    fetch('/api/agent/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        sessionId: getSessionId(),
        userId: getUserId()
      })
    })
    .then(r => r.json())
    .then(data => {
      removeLoading(loadingId);
      appendMessage('assistant', data.answer, data.toolCallCount, data.evalScore);
      if (data.memoryUsed) {
        showMemoryBar('已应用你的旅行偏好记忆：' + data.memoryUsed.substring(0, 60) + (data.memoryUsed.length > 60 ? '…' : ''));
      }
    })
    .catch(err => {
      removeLoading(loadingId);
      appendMessage('assistant', '请求失败：' + err.message, 0);
    })
    .finally(() => {
      isLoading = false;
      document.getElementById('send-btn').disabled = false;
      document.getElementById('input').focus();
    });
  }

  // ── DOM 工具 ─────────────────────────────────────────────────
  function appendMessage(role, text, toolCallCount, evalScore) {
    const container = document.getElementById('messages');

    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'ME' : '✈️';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    // 工具调用 + 评分徽章（仅 assistant）
    if (role === 'assistant' && (toolCallCount > 0 || evalScore > 0)) {
      const badge = document.createElement('div');
      badge.className = 'tool-badge';
      let html = '';
      if (toolCallCount > 0) html += `🔧 ${toolCallCount} 个工具`;
      if (evalScore > 0) {
        const stars = '⭐'.repeat(Math.min(evalScore, 5));
        html += `${toolCallCount > 0 ? ' · ' : ''}<span class="eval-score">${stars} ${evalScore}/5</span>`;
      }
      badge.innerHTML = html;
      bubble.appendChild(badge);
    }

    // 简单格式化：把换行转为 <br>，代码块包 <pre>
    const content = document.createElement('div');
    content.innerHTML = formatText(text);
    bubble.appendChild(content);

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
  }

  function showLoading() {
    const id = 'loading_' + Date.now();
    const container = document.getElementById('messages');
    const msg = document.createElement('div');
    msg.className = 'message assistant';
    msg.id = id;
    msg.innerHTML = `
      <div class="avatar">✈️</div>
      <div class="loading-bubble">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>`;
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
    return id;
  }

  function removeLoading(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function formatText(text) {
    // 转义 HTML
    const escaped = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    // 代码块
    const withCode = escaped.replace(/```([\s\S]*?)```/g, '<pre>$1</pre>');

    // 粗体 **text**
    const withBold = withCode.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

    // 换行
    return withBold.replace(/\n/g, '<br>');
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }
</script>
</body>
</html>
