# 服务端口，类比 Flask 的 app.run(port=8080)
server.port=8080

# DeepSeek API 配置
# 真实项目中这个值从环境变量注入，不写死在代码里
deepseek.api.key=${DEEPSEEK_API_KEY:your-key-here}
deepseek.api.url=https://api.deepseek.com/chat/completions
deepseek.model=deepseek-v4-flash

# Redis 配置（长期记忆持久化）
# 本地开发默认连 localhost:6379（无密码）
# 生产环境在 application-prod.properties 里覆盖
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# 打印 HTTP 请求日志，开发时方便调试
logging.level.com.example.agent=DEBUG
