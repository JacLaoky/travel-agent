# 服务端口，类比 Flask 的 app.run(port=8080)
server.port=8080

# DeepSeek API 配置
# 真实项目中这个值从环境变量注入，不写死在代码里
deepseek.api.key=${DEEPSEEK_API_KEY:your-key-here}
deepseek.api.url=https://api.deepseek.com/v1/chat/completions
deepseek.model=deepseek-chat

# 打印 HTTP 请求日志，开发时方便调试
logging.level.com.example.agent=DEBUG
